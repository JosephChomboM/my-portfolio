packages:
  - '.'
# Pin Vite (read by pnpm 10 and 11 alike, unlike package.json#pnpm).
overrides:
  vite: 6.3.5
supportedArchitectures:
  os:
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
# Refuse packages published < 7 days ago, matching the root pnpm-workspace.yaml.
minimumReleaseAge: 10080
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
